; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Bodoque]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 250000000L
lib_deps = 
	adafruit/Adafruit TinyUSB Library@^3.7.0
	fortyseveneffects/MIDI Library@^5.0.2
    https://github.com/tttapa/Control-Surface.git
	adafruit/Adafruit SSD1306 @ ^2.5.7
board_build.arduino.earlephilhower.usb_product = Bodoque MidiControl
board_build.arduino.earlephilhower.usb_manufacturer = Rasho
board_build.arduino.earlephilhower.usb_vid = 0xACAB
board_build.arduino.earlephilhower.usb_pid = 0x1337
build_flags = -DUSE_TINYUSB ;para midi por USB